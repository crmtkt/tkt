<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<title>CRM CMA | SKT · Quản trị</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: tự tin, ấm, rõ ràng — công cụ nội bộ của một hệ sinh thái giáo dục
   IDEA: bảng điều khiển "Hệ sinh thái CMA" theo 9 ô của bản đồ vận hành
   PICTURE: mái vòm CMA phát sáng, các vệ tinh AI/Agent quay quanh, trên dãy núi
   COLOUR and TYPE: xanh đêm #0a1230, vàng CMA #f5c451, 9 màu nút theo ảnh mẫu; Be Vietnam Pro
   LAYOUT: sidebar 9 ô bên trái, nội dung bên phải; hồ sơ mở dạng ngăn kéo bên phải */
:root{color-scheme:dark;--bg:#0b1433;--bg2:#101c46;--side:#070d24;--card:#13214f;--line:#24346e;--ink:#eef2ff;--mut:#a8b3d8;--gold:#f5c451;--gold2:#ffdf8a;--ok:#34d399;--warn:#fb923c;--bad:#f87171;
--paper:#ffffff;--pink:#1b2340;--pmut:#5b6585;--pline:#dde3f1}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#22407f 0,transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;background-color:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid #18224a}
.brand{display:flex;gap:12px;align-items:center;margin:0 4px 22px;text-decoration:none;color:var(--ink)}
.brand b{font-size:26px;letter-spacing:.5px;font-weight:800}
.brand small{display:block;font-size:9.5px;white-space:nowrap;color:var(--mut);letter-spacing:.3px}
.nav{display:grid;gap:10px}
.nav a{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:12px;color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px -6px var(--c);border:1px solid rgba(255,255,255,.12);transition:transform .15s,filter .15s}
.nav a:hover{transform:translateX(3px);filter:brightness(1.1)}
.nav a.on{outline:2px solid #fff;outline-offset:2px}
.nav svg{width:24px;height:24px;flex:none}
.nav .home{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--mut)}
.side-foot{margin-top:18px;font-size:13px;color:var(--mut);padding:0 6px}
main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px max(3vw,16px);background:rgba(10,18,48,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid #1b2a5c}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
.pill{font-size:13px;padding:5px 12px;border-radius:99px;background:#1c2b62;color:var(--mut);white-space:nowrap}
.pill.ok{background:#0f3b33;color:#a7f3d0}.pill.warn{background:#4a2a12;color:#fed7aa}
.band{padding:clamp(20px,3vw,40px) max(3vw,16px)}
h2{font-size:clamp(24px,3vw,32px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-size:19px;margin:0 0 8px}
.mut{color:var(--mut)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:330px;border-radius:22px;padding:clamp(22px,3vw,40px);background:linear-gradient(160deg,#1a3270,#0e1a44 70%);border:1px solid #2a3d80;overflow:hidden;position:relative}
.hero h2{font-size:clamp(30px,4.4vw,52px);font-weight:800;line-height:1.05;margin:0 0 14px}
.hero h2 span{color:var(--gold);text-shadow:0 0 28px rgba(245,196,81,.45)}
.hero p{font-size:18px;color:#cdd6f6;margin:0;max-width:30em}
.hero svg{width:100%;height:auto;max-height:320px}
.eco{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:22px}
.f{border-radius:16px;padding:18px 14px;text-align:center;border:1.5px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#0b1433),#0e1a44);box-shadow:0 0 22px -8px var(--c);text-decoration:none;color:#fff;display:block}
.f b{display:block;font-size:22px;font-weight:800}
.f span{font-size:14px;color:#dbe2ff}
a.f:hover{box-shadow:0 0 30px -4px var(--c);filter:brightness(1.12)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{font-size:30px;display:block;line-height:1.1}
.stat span{font-size:14px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0 22px}
.course{all:unset;cursor:pointer;display:block;border-radius:18px;padding:20px;border:2px solid transparent;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 10px 30px -14px var(--c1)}
.course.on{border-color:#fff}
.course small{font-size:13px;opacity:.85}
.course b{display:block;font-size:24px;font-weight:800;margin:2px 0 6px}
.course .n{font-size:14px;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px;display:inline-block}
.course:focus-visible{outline:3px solid var(--gold)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tab{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#111d48;color:var(--ink);font-size:14.5px}
.tab.on{background:var(--gold);color:#1a1400;border-color:var(--gold);font-weight:700}
.tab .c{opacity:.7;margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 14px}
.inp,select.inp{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#0d1840;color:var(--ink);font-size:16px}
.inp::placeholder{color:#7d88b3}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:0;background:var(--gold);color:#1a1400;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #1c2a5c;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#15245a}
.who{display:flex;gap:10px;align-items:center}
.ava{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#22346f;flex:none;display:grid;place-items:center;font-weight:700;color:var(--gold)}
.st{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;white-space:nowrap;background:color-mix(in srgb,var(--sc) 22%,transparent);color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.tag{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:6px;background:#1f2e66;color:#c7d2fe;margin:1px 2px 1px 0;white-space:nowrap}
.tag.mau{background:#4a3a10;color:#fde68a}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.sub{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:16px}
.sub b{display:block;margin-bottom:4px}
.soon{font-size:12.5px;color:var(--gold2)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,6,20,.6);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(760px,100vw);background:#0d1840;border-left:1px solid var(--line);z-index:21;overflow:auto;transform:translateX(100%);transition:transform .25s}
.drawer.on{transform:none}
.dh{display:flex;gap:16px;align-items:center;padding:20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0d1840;z-index:2}
.dh img,.dh .ava{width:84px;height:84px;font-size:28px;border-radius:16px}
.dh h3{font-size:22px;margin:0}
.dbody{padding:20px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:15px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#111d48;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid #2e4290}
.tl li{white-space:pre-wrap;position:relative;padding:4px 0 12px 8px}
.tl li::before{content:"";position:absolute;left:-26px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--tc,#60a5fa);box-shadow:0 0 0 3px #0d1840}
.tl small{color:var(--mut);display:block;font-size:13px}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.months label{font-size:13px;color:var(--mut)}
.months textarea,.dbody textarea{width:100%}
textarea.inp{min-height:70px;resize:vertical}
.lv{display:flex;gap:4px;align-items:center}
.lv i{width:16px;height:8px;border-radius:3px;background:#24346e}
.lv i.on{background:var(--gold)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f3b33;color:#d1fae5;padding:12px 18px;border-radius:12px;z-index:40;display:none;max-width:90vw}
.toast.on{display:block}
.toast.err{background:#5b1f1f;color:#fee2e2}
/* form (student facing) — Diamond theme */
.fpage{min-height:100vh;padding:clamp(18px,4vw,48px) max(4vw,14px) 40px;background:radial-gradient(900px 500px at 15% -5%,rgba(217,70,239,.35),transparent 60%),radial-gradient(800px 500px at 100% 10%,rgba(124,58,237,.45),transparent 60%),linear-gradient(180deg,#2b0a52,#150630 60%,#0e0424)}
.formwrap{max-width:760px;margin:0 auto}
.backcrm{display:inline-block;color:#e9d5ff;text-decoration:none;font-size:15px;margin-bottom:6px;padding:8px 0}
.fhero{text-align:center;padding:4px 0 18px}
.fhero svg{filter:drop-shadow(0 6px 18px rgba(245,196,81,.45))}
.kick{margin:8px 0 2px;font-size:14px;color:#f0abfc;font-weight:600}
.fhero h2{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:4px 0 10px;color:#fff}
.fhero h2 span{background:linear-gradient(90deg,#ffe29a,#f5b83d);-webkit-background-clip:text;background-clip:text;color:transparent}
.fhero p{color:#e9ddff;max-width:36em;margin:6px auto 0;font-size:16.5px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 20px}
.why div{background:rgba(255,255,255,.07);border:1px solid rgba(233,213,255,.2);border-radius:14px;padding:14px;font-size:14.5px;color:#ede4ff}
.why b{display:block;color:#ffd978;margin-bottom:2px;font-size:15.5px}
form.paper{color-scheme:light;background:#fff;color:#241338;border-radius:22px;padding:clamp(18px,4vw,40px);box-shadow:0 30px 80px -30px #000;border-top:6px solid #a43be6}
.sec{border-top:1px solid #ece4f6;padding-top:26px;margin-top:26px}
.sec:first-of-type{border:0;margin:0;padding:0}
.sec h3{font-size:21px;color:#3d0f6e;display:flex;gap:12px;align-items:center;margin-bottom:4px}
.sec h3 em{font-style:normal;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c2bd6,#c026d3);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;box-shadow:0 4px 12px -4px #a43be6}
.sec>p{color:#6e5d86;margin:0 0 18px;font-size:15px}
.fld{margin:0 0 20px}
.paper .fld>label,.paper .fld>.lb{display:block;font-weight:600;margin:0 0 8px;font-size:16px;color:#241338}
.paper .fld .hint{display:block;font-weight:400;color:#6e5d86;font-size:14px;margin-top:3px}
.req{color:#d6336c}
.paper .inp{width:100%;background:#faf7fe;color:#241338;border:1.5px solid #ddd0ee;border-radius:12px;min-height:50px;padding:12px 14px;font-size:16px}
.paper .inp:focus{outline:0;border-color:#a43be6;box-shadow:0 0 0 4px rgba(164,59,230,.15);background:#fff}
.paper .inp::placeholder{color:#9d8fb3}
.paper textarea.inp{min-height:110px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid #ddd0ee;background:#faf7fe;cursor:pointer;font-size:15.5px}
.opts input{width:20px;height:20px;accent-color:#8b2fd9;flex:none}
.opts label:has(input:checked){border-color:#8b2fd9;background:#f3e8ff;color:#3d0f6e;font-weight:600}
.opts.agree label{width:100%;align-items:flex-start;line-height:1.45}
.opts.agree input{margin-top:2px}
.levels{display:grid;gap:10px}
.levels label{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1.5px solid #ddd0ee;background:#faf7fe;cursor:pointer}
.levels input{width:20px;height:20px;accent-color:#8b2fd9}
.levels label:has(input:checked){border-color:#8b2fd9;background:#f3e8ff}
.levels b{font-size:15.5px}
.levels span{font-size:14px;color:#6e5d86}
.levels .lvn{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c2bd6,#c026d3);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.photo{display:flex;gap:18px;align-items:center}
.photo .pv{width:120px;height:120px;border-radius:50%;background:#f3e8ff;border:2px dashed #c4a6ea;display:grid;place-items:center;overflow:hidden;color:#7b5aa6;font-size:13px;text-align:center;flex:none;cursor:pointer;padding:8px;position:relative}
.photo .pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbtn small{display:block;color:#6e5d86;font-size:13.5px;margin-top:6px}
.btn2{display:inline-flex;align-items:center;min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid #8b2fd9;color:#5b1aa3;font-weight:600;cursor:pointer;background:#fff}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.photo:focus-within .btn2{outline:3px solid #c026d3;outline-offset:2px}
.secure{background:#f7f0ff;border:1px solid #e2cff7;border-radius:14px;padding:16px 18px;font-size:15px;color:#3d2a5c;margin-bottom:16px}
.secure ul{margin:6px 0 0;padding-left:20px}
.secure li{margin:3px 0}
.err{color:#c2255c;font-size:14px;margin-top:6px;display:none}
.fld.bad .err{display:block}
.fld.bad .inp,.fld.bad .opts label,.fld.bad .levels label,.fld.bad .pv{border-color:#e0679a}
.send{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:14px;background:linear-gradient(90deg,#7c2bd6,#c026d3);color:#fff;font-weight:700;font-size:17px;box-shadow:0 12px 28px -12px #a43be6;text-decoration:none;cursor:pointer}
.send:hover{filter:brightness(1.08)}
.send:disabled{opacity:.6}
.send.sm{width:auto;min-height:46px;padding:8px 20px;font-size:15.5px;display:inline-flex}
.send.ghost2{background:#fff;color:#5b1aa3;border:1.5px solid #8b2fd9;box-shadow:none}
.ffoot{text-align:center;color:#c9b6ea;font-size:13.5px;margin-top:22px}
.tcard{color-scheme:light;background:#fff;color:#241338;border-radius:24px;padding:clamp(24px,5vw,48px);text-align:center;box-shadow:0 30px 80px -30px #000;border-top:6px solid #a43be6}
.tcard h2{color:#3d0f6e;font-size:clamp(28px,5vw,40px);margin:4px 0 10px}
.tcard h3{color:#3d0f6e}
.tcard .kick{color:#a43be6}
.tcard .inp{background:#faf7fe;color:#241338;border:1.5px solid #ddd0ee}
.tic svg{width:84px;height:84px;filter:drop-shadow(0 8px 20px rgba(245,184,61,.5))}
.lead{font-size:17px;color:#4a3966;max-width:34em;margin:0 auto 22px}
.next{list-style:none;counter-reset:n;padding:0;margin:0 auto 22px;max-width:30em;text-align:left;display:grid;gap:12px}
.next li{counter-increment:n;display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 12px;background:#faf7fe;border:1px solid #ece4f6;border-radius:14px;padding:12px 14px}
.next li::before{content:counter(n);grid-row:span 2;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c2bd6,#c026d3);color:#fff;display:grid;place-items:center;font-weight:700}
.next span{color:#6e5d86;font-size:14.5px}
.quote{color:#5b4a78;font-size:15.5px;margin:0}
.quote b{color:#a43be6}
.staffrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.demo{color:#6e5d86;font-size:13.5px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(400px,100%);padding:26px}
.pw{position:relative}.pw .inp{padding-right:52px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;border-radius:8px}.eye:hover{color:var(--gold)}
.fl{display:grid;gap:16px}
.fcard h3{margin:0 0 2px}
.fhead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.linkrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.linkrow .inp{flex:1 1 260px;color:var(--gold2)}
.fstats{margin-top:10px;color:var(--mut);font-size:14.5px}.fstats b{color:var(--ink);font-size:18px}
@media(max-width:1100px){.eco{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero svg{max-height:240px}}
.fams{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 0}
.fam{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,#0b1433),#0e1a44);min-height:44px}
.fam b{font-size:17px}.fam span{font-size:13.5px;color:#dbe2ff}.fam small{font-size:12px;color:var(--mut)}
.fam.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 22px -6px var(--c)}
.fam:focus-visible{outline:3px solid var(--gold)}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:#0d1840}
.seg button{border:0;background:transparent;color:var(--mut);min-height:38px;padding:6px 14px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--gold);color:#1a1400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.hv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.hvtop{display:flex;gap:12px;align-items:center}
.hvimg{width:72px!important;height:72px!important;border-radius:16px!important;font-size:24px;object-fit:cover}
.hvname{font-size:17px;display:block;line-height:1.25}
.sm{font-size:13.5px}
.hvrow{display:flex;flex-wrap:wrap;gap:6px}

async function saveEditor(cancel){
 if(!EDITING)return;const {td,x,f}=EDITING;const type=EDIT[f];
 if(cancel){EDITING=null;td.classList.remove('editing');td.innerHTML=shown(x,f)||'<span class="mut">+ Thêm</span>';return}
 let val;
 if(type==='staff')val=[...td.querySelectorAll('input:checked')].map(i=>i.value);
 else{const el=td.querySelector('.cellin');val=el?el.value.trim():''}
 const old=Array.isArray(x[f])?x[f].join(', '):String(x[f]??'');
 if((Array.isArray(val)?val.join(', '):val)===old){return saveEditor(true)}
 if(f==='zaloGroup'&&val&&!safeUrl(val)){toast('Link Zalo phải bắt đầu bằng https://',true);return}
 if(f==='sdt'&&!/^\+?\d{9,12}$/.test(val.replace(/[\s.-]/g,''))){toast('Số điện thoại chưa đúng.',true);return}
 if(f==='hoTen'&&!val){toast('Họ tên không được trống.',true);return}
 EDITING=null;td.classList.remove('editing');td.innerHTML='<span class="mut">Đang lưu…</span>';
 const p={[f]:val};if(f==='trangThai')p.hanhTrinh=[...arr(x.hanhTrinh),{ngay:today(),noiDung:'Chuyển trạng thái: '+val}];if(f==='khoa'&&val!=='Diamond')p.nhom='';
 await patch(x.id,p,'Đã lưu');
}

let busy=false;
async function patch(id,p,msg){
 if(busy)return;busy=true;
 try{if(isDemo(id)){Object.assign(S.list.find(r=>r.id===id),p);toast((msg||'Đã lưu')+' (dữ liệu mẫu, không lưu thật)');render();return}
  const j=await api('record_save',{id,patch:p});const i=S.real.findIndex(r=>r.id===id);if(i>=0)S.real[i]=j.record;mergeList();toast(msg||'Đã lưu');render()}
 catch(e){toast(e.message||'Chưa lưu được, anh/chị thử lại.',true);render()}
 finally{busy=false}
}

const TITLES={'tong-quan':'Tổng quan','form':'Form thu thập'};
function route(){
 document.body.classList.remove('menu-open');
 if(!S.loaded)return;
 let r=(location.hash||'').slice(1)||'tong-quan';
 const m=MODS.find(x=>x.id===r);if(!m&&!TITLES[r])r='tong-quan';
 document.body.classList.remove('solo');
 renderNav(r);$('#title').textContent=m?`${m.n}. ${m.name}`:TITLES[r];
 S.route=r;render(true);
}
function render(full){
 if(!S.loaded||!S.route)return;
 const r=S.route,y=scrollY;
 $('#view').innerHTML=r==='tong-quan'?vHome():r==='san-pham'?vProducts():r==='khach-hang'?vCustomers():r==='nhan-su'?vStaff():r==='form'?vForms():vModule(MODS.find(x=>x.id===r));
 scrollTo(0,full?0:y);
 const fo=document.querySelector('.fam.on');if(fo){const c=fo.parentElement;c.scrollLeft=fo.offsetLeft-c.clientWidth/2+fo.clientWidth/2}
 setTimeout(loadPhotos,50);
}

 if(t.dataset.course){S.f.khoa=t.dataset.course;S.f.nhom='all';render();return}
 if(t.dataset.nam){S.f.nam=t.dataset.nam;render();return}

 if(t.matches('a.f')&&t.dataset.eco){S.f.fam='F'+(+t.dataset.eco+1)}
 if(t.dataset.fam){S.f.fam=t.dataset.fam;render();return}
 if(t.id==='closeD'){closeDrawer();return}
 if(t.id==='logout'){setTok('');S.loaded=false;clearInterval(poll);showLogin();return}
 if(t.dataset.demo){S.demo=!S.demo;try{localStorage.setItem('crm_demo',S.demo?'1':'')}catch(_){}mergeList();render();toast(S.demo?'Đã bật dữ liệu mẫu (chỉ trên máy này).':'Đã tắt dữ liệu mẫu.');return}
 if(t.dataset.cellsave){await saveEditor();return}
 if(t.dataset.view){S.view=t.dataset.view;try{localStorage.setItem('crm_view',S.view)}catch(_){}render();return}
 if(t.id==='sideToggle'){const m=document.body.classList.toggle('side-mini');try{localStorage.setItem('crm_mini',m?'1':'')}catch(_){}t.setAttribute('aria-label',m?'Mở rộng menu':'Thu gọn menu');return}
 if(t.id==='menuBtn'){document.body.classList.add('menu-open');return}
 if(t.id==='eye'){const i=$('#lp'),show=i.type==='password';i.type=show?'text':'password';t.querySelector('.slash').style.display=show?'':'none';t.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');t.title=t.getAttribute('aria-label');i.focus();return}
 if(t.id==='newForm'){formModal();return}
 if(t.dataset.copy){const f=S.forms.find(x=>x.id===t.dataset.copy);try{await navigator.clipboard.writeText(formLink(f));toast('Đã sao chép link. Dán vào Zalo gửi học viên nhé.')}catch(_){toast('Bôi đen ô link rồi sao chép thủ công giúp em.',true)}return}
 if(t.dataset.editform){formModal(S.forms.find(x=>x.id===t.dataset.editform));return}
 if(t.dataset.viewform){const f=S.forms.find(x=>x.id===t.dataset.viewform);S.f={...S.f,fam:['Diamond','Trainer'].includes(f.khoa)?'F5':S.f.fam,form:f.id,khoa:['Diamond','Trainer'].includes(f.khoa)?f.khoa:S.f.khoa,nam:'all',nhom:'all'};location.hash='san-pham';return}
 if(t.dataset.export){exportCsv(t.dataset.export);return}
 if(t.dataset.toggleform){const f=S.forms.find(x=>x.id===t.dataset.toggleform);try{await api('form_save',{...f,mo:!f.mo});await reload();toast(f.mo?'Đã đóng form':'Đã mở lại form')}catch(err){toast(err.message,true)}return}
 if(t.dataset.delform){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Bấm lần nữa để xóa';return}try{await api('form_delete',{id:t.dataset.delform});await reload();toast('Đã xóa form')}catch(err){toast(err.message,true)}return}
 if(t.dataset.delstaff!==undefined){await saveStaff(S.staff.filter((_,i)=>i!==+t.dataset.delstaff));return}

 if(e.target.id==='cpt'){S.cf.pt=e.target.value;render()}
 if(e.target.id==='feKhoa'){$('#feKhacWrap').style.display=e.target.value==='__khac'?'':'none'}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.body.classList.remove('menu-open')}if(e.key==='Enter'&&e.target.matches('tr[data-open]'))openDrawer(e.target.dataset.open)});
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('click',e=>{const td=e.target.closest('td.ed');if(EDITING&&!e.target.closest('td.editing')){saveEditor();return}if(td&&!td.classList.contains('editing')&&!e.target.closest('a'))openEditor(td)});
document.addEventListener('keydown',e=>{if(!EDITING){if(e.key==='Enter'&&e.target.matches('td.ed'))openEditor(e.target);return}if(e.key==='Escape'){e.preventDefault();saveEditor(true)}else if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('input.cellin,select.cellin')){e.preventDefault();saveEditor()}});
document.addEventListener('change',e=>{if(EDITING&&e.target.matches('select.cellin'))saveEditor()});
$('#mscrim').addEventListener('click',()=>document.body.classList.remove('menu-open'));
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))document.body.classList.remove('menu-open')});

function exportCsv(fid){
 const f=S.forms.find(x=>x.id===fid);const cols=[['Ngày gửi','createdAt'],['Họ tên','hoTen'],['Năm sinh','namSinh'],['SĐT','sdt'],['Email','email'],['Tỉnh/thành','thanhPho'],['Công việc','congViec'],['Vai trò','vaiTro'],['Khóa đã và đang học','khoaDaHoc'],['Lý do đăng ký','lyDo'],['Cần thầy hỗ trợ','vanDe'],['Mong muốn','mongMuon'],['Kết quả mong đợi','ketQua'],['Rào cản','ngaiNgai'],['Muốn đóng gói','sanPhamRieng'],['Thời gian học/tuần','thoiGian'],['Cấp độ AI','aiLevel'],['Công cụ AI','aiTools'],['Đã dùng AI để','aiDaLam'],['Muốn AI giúp','aiMuon'],['Trạng thái','trangThai'],['Người phụ trách','phuTrach'],['Nhóm','nhom'],['Link Zalo','zaloGroup'],['Ghi chú','ghiChu']];
 const cell=v=>{v=Array.isArray(v)?v.join(', '):String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const rows=S.list.filter(r=>r.formId===fid).map(r=>cols.map(c=>cell(r[c[1]])).join(','));
 const blob=new Blob(['\ufeff'+[cols.map(c=>cell(c[0])).join(','),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'});
 const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=(f?f.slug:'phieu')+'-'+today().replace(/-/g,'')+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
 toast(rows.length?`Đã tải ${rows.length} phiếu ra file Excel (CSV).`:'Form này chưa có phiếu nào, file chỉ có dòng tiêu đề.');
}
async function saveStaff(list){
 try{await api('staff_save',{list});S.staff=list;render();toast('Đã cập nhật nhân sự')}catch(err){toast(err.message,true)}
}
async function reload(quiet){
 const j=await api('bootstrap');
 S.forms=j.forms;S.real=j.records;mergeList();S.staff=j.staff&&j.staff.length?j.staff:DEFAULT_STAFF.slice();S.loaded=true;
 setConn(`Đã đồng bộ · ${S.real.length} học viên`,'ok');
 if(quiet&&($('#drawer').classList.contains('on')||EDITING))return; // không làm mất chữ đang gõ trong hồ sơ
 if(quiet&&S.route==='san-pham'&&document.activeElement&&document.activeElement.id==='q')return;
 render(!quiet&&false);
}

/* ---------- Khởi động ---------- */
let poll;
async function boot(){
 if(!TOK){showLogin();return}
 let me;try{me=await api('me')}catch(err){showLogin(/hết/.test(err.message)?'':err.message);return}
 S.user=me.user;
 $('.top').insertAdjacentHTML('beforeend',$('#logout')?'':`<button class="btn ghost sm" id="logout">Đăng xuất</button>`);
 try{await reload()}catch(err){setConn('Chưa tải được dữ liệu','warn');toast(err.message,true);return}
 route();
 clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==='visible')reload(true).catch(()=>{})},30000);
}
try{if(localStorage.getItem('crm_mini'))document.body.classList.add('side-mini')}catch(_){}
boot();
}
